name: Ingresos - Notificar (1 correo semanal)

# Genera los PPT de la semana, los sube a la carpeta "SEMANA XX - AAAA" y manda
# UN SOLO correo con todos los PPT adjuntos.
#
# Sin cron nativo a propósito: el cron de GitHub es errático y acá un disparo
# duplicado significa un correo duplicado al equipo. El disparo puntual lo hace
# cron-job.org con event_type "ingresos_notificar" (viernes por la tarde).

on:
  repository_dispatch:
    types: [ingresos_notificar]

  workflow_dispatch:
    inputs:
      semana_anterior:
        description: "Informar la semana que ya cerró (en vez de la en curso)"
        type: boolean
        required: false
        default: false
      semana:
        description: "(Opcional) N° de semana ISO puntual. Vacío = según lo de arriba"
        required: false
        default: ""
      anio:
        description: "(Opcional) Año ISO de esa semana"
        required: false
        default: ""
      cliente:
        description: "(Opcional) Solo campañas de este cliente"
        required: false
        default: ""
      campana:
        description: "(Opcional) Solo esta campaña"
        required: false
        default: ""
      destinatarios:
        description: "(Opcional) Correos exactos separados por coma. Ignora la config"
        required: false
        default: ""

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar, subir y enviar el correo semanal de ingresos
        shell: bash
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_INGRESOS_ID: ${{ secrets.DRIVE_CARPETA_INGRESOS_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          IN_SEMANA_ANTERIOR: ${{ inputs.semana_anterior }}
          IN_SEMANA: ${{ inputs.semana }}
          IN_ANIO: ${{ inputs.anio }}
          IN_CLIENTE: ${{ inputs.cliente }}
          IN_CAMPANA: ${{ inputs.campana }}
          IN_DESTINATARIOS: ${{ inputs.destinatarios }}
        run: |
          set -euo pipefail

          # Array de bash para que los nombres con espacios ("Kimberly Clark")
          # lleguen como un solo argumento.
          ARGS=(--enviar)

          if [ "${IN_SEMANA_ANTERIOR:-false}" = "true" ]; then
            ARGS+=(--semana-anterior)
          fi
          if [ -n "${IN_SEMANA:-}" ]; then
            ARGS+=(--semana "$IN_SEMANA")
          fi
          if [ -n "${IN_ANIO:-}" ]; then
            ARGS+=(--anio "$IN_ANIO")
          fi
          if [ -n "${IN_CLIENTE:-}" ]; then
            ARGS+=(--cliente "$IN_CLIENTE")
          fi
          if [ -n "${IN_CAMPANA:-}" ]; then
            ARGS+=(--campana "$IN_CAMPANA")
          fi
          if [ -n "${IN_DESTINATARIOS:-}" ]; then
            ARGS+=(--destinatarios "$IN_DESTINATARIOS")
          fi

          echo "Ejecutando: python src/main_ingresos.py ${ARGS[*]}"
          python src/main_ingresos.py "${ARGS[@]}"
