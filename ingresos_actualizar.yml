name: Ingresos - Actualizar PPT (semana en curso)

# Genera y sube los PPT de la semana EN CURSO a la carpeta "SEMANA XX - AAAA".
# NO manda correo. Sirve para que la carpeta esté siempre al día y los links
# ya enviados apunten a la última versión.

on:
  # 1) Disparo externo desde cron-job.org (event_type "ingresos_actualizar").
  repository_dispatch:
    types: [ingresos_actualizar]

  # 2) Cron nativo de GitHub (respaldo, puede ser errático).
  #    Chile UTC-4: 12:00 y 18:00 Chile = 16:00 y 22:00 UTC.
  schedule:
    - cron: "0 16,22 * * 1-6"

  # 3) Botón manual, con opción de regenerar una semana pasada.
  workflow_dispatch:
    inputs:
      semana:
        description: "(Opcional) N° de semana ISO a regenerar. Vacío = semana en curso"
        required: false
        default: ""
      anio:
        description: "(Opcional) Año ISO de esa semana"
        required: false
        default: ""

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y subir PPT de ingresos (sin correo)
        shell: bash
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_INGRESOS_ID: ${{ secrets.DRIVE_CARPETA_INGRESOS_ID }}
          IN_SEMANA: ${{ inputs.semana }}
          IN_ANIO: ${{ inputs.anio }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${IN_SEMANA:-}" ]; then
            ARGS+=(--semana "$IN_SEMANA")
          fi
          if [ -n "${IN_ANIO:-}" ]; then
            ARGS+=(--anio "$IN_ANIO")
          fi
          # ${ARGS[@]+...} evita que un array vacío pase un argumento vacío
          echo "Ejecutando: python src/main_ingresos.py ${ARGS[*]-}"
          python src/main_ingresos.py ${ARGS[@]+"${ARGS[@]}"}
