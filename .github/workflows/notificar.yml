name: Notificar Interno (diario)

on:
  # Chile UTC-4: 15:00 Chile = 19:00 UTC.
  # El actualizador de las 14:00 ya dejó los archivos frescos en Drive,
  # así que el notificador solo los descarga y envía (rápido).
  # (Si Chile cambia a UTC-3 en verano, usar "0 18 * * *".)
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar de Drive + enviar correo interno
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python src/main.py --enviar
