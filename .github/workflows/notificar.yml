name: Notificar Interno (diario)

on:
  # Lunes a viernes a las 16:30 Chile (UTC-4 → 20:30 UTC).
  # El "1-5" significa lunes(1) a viernes(5). No corre sábados ni domingos.
  # (Si Chile cambia a UTC-3 en verano, usar "30 19 * * 1-5".)
  schedule:
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar de Drive + enviar correo interno
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python src/main.py --enviar
