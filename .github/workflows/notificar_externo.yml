name: Notificar Externo (lunes)

on:
  # Lunes a las 15:00 Chile (UTC-3 invierno → 18:00 UTC). 1 = lunes.
  # El actualizador de las 15:00 ya dejó los archivos frescos, así que
  # este notificador solo los descarga y envía (rápido).
  # Si Chile pasa a UTC-4 (verano), ajustar a "0 19 * * 1".
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

jobs:
  notificar_externo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar de Drive + enviar correo EXTERNO (clientes)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python src/main.py --enviar-externo
