name: Notificar Externo (lunes)

on:
  # Lunes a las 15:00 Chile (UTC-3 invierno → 18:00 UTC).
  # cron: minuto hora * * día_semana   (1 = lunes)
  # Si Chile pasa a UTC-4 (verano), ajustar a "0 19 * * 1".
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

jobs:
  notificar_externo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar Drive + enviar correo EXTERNO (clientes)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python src/main.py --enviar-externo
