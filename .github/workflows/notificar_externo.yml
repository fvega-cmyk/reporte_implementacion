name: Notificar Externo (lunes)

on:
  # Disparo ÚNICO desde cron-job.org (puntual). Sin cron nativo para evitar
  # correos duplicados. cron-job.org debe configurarse los lunes 15:00 Chile.
  repository_dispatch:
    types: [notificar_externo]
  # Botón manual.
  workflow_dispatch:

jobs:
  notificar_externo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Regenerar fresco + enviar correo EXTERNO (clientes)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python src/main.py --enviar-externo
