name: Actualizar Reportes (cada hora)

on:
  # 1) Disparo externo desde cron-job.org (principal, puntual).
  #    cron-job.org llama a la API de GitHub con event_type "actualizar".
  repository_dispatch:
    types: [actualizar]

  # 2) Cron nativo de GitHub (respaldo, puede ser errático).
  #    Chile UTC-4: 11:00–20:00 Chile = 15:00–00:00 UTC.
  schedule:
    - cron: "0 15-23 * * *"
    - cron: "0 0 * * *"

  # 3) Botón manual.
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar y subir reportes a Drive (sin correo)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
        run: python src/main.py
