name: Actualizar Reportes (cada hora)

on:
  # Chile está en UTC-4. Para 11:00–20:00 Chile → 15:00–00:00 UTC.
  # 15-23 cubre 11:00 a 19:00 Chile; el 0 agrega las 20:00 Chile.
  # (Si Chile cambia a UTC-3 en verano, restar 1 a cada hora UTC.)
  schedule:
    - cron: "0 15-23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar y subir reportes a Drive (sin correo)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
        run: python src/main.py
