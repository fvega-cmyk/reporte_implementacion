name: Actualizar Reportes (cada hora)

on:
  # Cada hora de 11:00 a 20:00 Chile (UTC-3 invierno → 14:00 a 23:00 UTC).
  # La corrida de las 11:00 deja los archivos frescos ANTES del notificador (11:30).
  # Si Chile pasa a UTC-4 (verano), correr los horarios 1 hora.
  schedule:
    - cron: "0 14-23 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar y subir reportes a Drive (sin correo)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_CARPETA_REPORTES_ID: ${{ secrets.DRIVE_CARPETA_REPORTES_ID }}
        run: python src/main.py
